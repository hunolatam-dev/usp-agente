  - "Gestión de RRHH (remuneraciones, contratos y finiquitos)"
  - "Administración de empresas"
  - "Marketing digital"
  - "Sistemas y desarrollo web (sitios, apps y software a medida)"

# Precio de referencia: "los valores comienzan en ..." (CLP mensual)
precio_desde: 55000
# Sitio para cotizar el plan (el cliente indica qué necesita y recibe el valor mensual por correo).
# Mientras esté vacío, el agente deriva la cotización a un ejecutivo.
cotizador_url: ""

# Datos para transferir. Se le entregan al cliente tal cual.
datos_transferencia:
  titular: "HUNO"
  rut: "77.663.555-3"
  banco: "Bci / Mach"
  tipo_cuenta: "Cuenta corriente"
  numero_cuenta: "89635451"
  correo: "pagos@huno.cl"

# Cuentas de HUNO que reciben pagos. Si el comprobante muestra una cuenta destino
# distinta (comparando los últimos 4 dígitos), el pago NO se confirma y va a una persona.
# Dejar vacío desactiva este control (no recomendado).
cuentas_destino:
  - "89635451"

# Plazo de pago: días corridos desde la emisión de la factura
plazo_pago_dias: 15

# Horario de atención de los ejecutivos (hora de Chile). Con esto el agente le dice al
# cliente CUÁNDO le van a responder ("hoy", "mañana a partir de las 9:00", "el lunes...").
# Los días que no aparecen están cerrados.
