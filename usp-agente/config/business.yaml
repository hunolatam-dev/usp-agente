# Datos de USP (Unidad de Servicios y Pagos) de HUNO®
# Todo lo que diga "COMPLETAR" hay que llenarlo antes de producción.

negocio:
  nombre: "HUNO®"
  area: "USP — Unidad de Servicios y Pagos"
  whatsapp: "+56 9 7870 1038"
  horario: "lunes a jueves de 9:00 a 18:00 hrs y viernes de 9:00 a 17:30 hrs (sábados, domingos y festivos cerrado)"
  correo_cobranza: "pagos@huno.cl"
  sucursales:
    - "Copiapó: Los Carrera #401"
    - "La Serena: Cristóbal Colón #352"

agente:
  nombre: "Asistente USP de HUNO®"
  tono: "profesional, cercano y breve"

# Datos para transferir. Se le entregan al cliente tal cual.
datos_transferencia:
  titular: "HUNO"
  rut: "77.663.555-3"
  banco: "Bci / Mach"
  tipo_cuenta: "Cuenta corriente"
  numero_cuenta: "89635451"
  correo: "pagos@huno.cl"

# Cuentas de HUNO que reciben pagos. Si el comprobante muestra una cuenta destino
# distinta (comparando los últimos 4 dígitos), el pago NO se confirma y va a una persona.
# Dejar vacío desactiva este control (no recomendado).
cuentas_destino:
  - "89635451"

# Plazo de pago: días corridos desde la emisión de la factura
plazo_pago_dias: 15

# Reglas de confirmación automática
reglas:
  # Días que puede tardar en aparecer en la cartola un pago respecto de la fecha del comprobante
  dias_antes: 1
  dias_despues: 4
  # Si el comprobante es más antiguo que esto y no aparece en el banco, se escala
  dias_espera_banco: 3
  # Sobre este monto (CLP) nunca se confirma solo; lo revisa una persona
  monto_maximo_auto: 3000000
  # Horas que el agente se queda callado cuando un ejecutivo responde desde el celular
  pausa_humano_horas: 12
