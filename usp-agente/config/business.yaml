  lunes: "09:00-18:00"
  martes: "09:00-18:00"
  miercoles: "09:00-18:00"
  jueves: "09:00-18:00"
  viernes: "09:00-17:30"
  # Feriados en día hábil (AAAA-MM-DD). Agregar los del año siguiente cada diciembre.
