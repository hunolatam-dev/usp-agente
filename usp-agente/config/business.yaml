  otp_url: "https://iysjuwmjytqjvedxnsuf.supabase.co/functions/v1/send-otp"
  supabase_anon_key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5c2p1d21qeXRxanZlZHhuc3VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNzUzNDQsImV4cCI6MjA4ODc1MTM0NH0.gojA_q2zkHJQqSloCO8XXflcEnq09ahoppXADpIZ-QY"

# Archivos que llegan por WhatsApp (comprobantes, documentos): se conservan N días desde que
# llegan. Unos días antes se envían por correo como respaldo; nunca se borra uno sin respaldo.
# El correo lo envía huno.cl/api/usp_respaldo.php (solo puede enviar a esa dirección).
archivos:
  dias_conservacion: 180
  dias_respaldo: 170
  correo_respaldo: "alertas@huno.cl"

# Reglas de confirmación automática
reglas:
  # Días que puede tardar en aparecer en la cartola un pago respecto de la fecha del comprobante
  dias_antes: 1
  dias_despues: 4
  # Si el comprobante es más antiguo que esto y no aparece en el banco, se escala
  dias_espera_banco: 3
  # Sobre este monto (CLP) nunca se confirma solo; lo revisa una persona
  monto_maximo_auto: 3000000
  # Un pago igual a la suma exacta de las facturas pendientes MÁS ANTIGUAS de una empresa
  # se confirma solo (todas esas facturas quedan pagadas). false = siempre lo ve una persona.
  pago_varias_facturas: true
  # Horas que el agente se queda callado cuando un ejecutivo responde desde el celular
  pausa_humano_horas: 12
  # Si el cliente no responde (RUT o empresa de un comprobante) en estas horas, se deriva
  horas_sin_respuesta: 6
  # Máximo de consultas a la IA por número en una hora (protege el costo ante abusos)
  max_consultas_ia_hora: 30
